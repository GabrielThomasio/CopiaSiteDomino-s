<!DOCTYPE html>
<html lang="pt-Br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Login</title>
  <link rel="strylesheet" href="style.css">
</head>

<body>
  <main class="tela-de-login">
    <h1><a href="index.html"><img src="assets/Logo-dominos.png" alt="logo da Dominos Pizza"></a></h1>
    <h2>Bem-vindo</h2>
    <h3>Acesse sua conta</h3>

    <a href="#" class="botao botao-vermelho">Login com senha</a>
    <a href="#" class="botao botao-branco">Login com código</a>

    <p class="divisor">Faça login com</p>

    <div class="tipos-de-login">
      <a href="#"><img src="assets/logo-apple.png" alt="Logar com Apple"></a>
      <a href="#"><img src="assets/logo-google.jpg" alt="Logar com o Google"></a>
    </div>

    <p>Não tem uma conta? <a href="#">Crie agora</a></p>

    <form>
      <label for="campo-email">E-mail</label>
      <input type="email" id="campo-email" placeholder="email@email.com.br">

      <label for="campo-senha">Senha</label>
      <input type="password" id="campo-senha" placeholder="Digite sua senha">

      <button type="submit" class="botao botao-vermelho">Entrar</button>
    </form>


  </main>
</body>

</html>
